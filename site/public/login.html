<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether · Acesso de testes</title><style>body{margin:0;background:#030b18;color:#edf4ff;font:18px system-ui;display:grid;min-height:100vh;place-items:center}main{max-width:420px;padding:32px}h1{color:#23d9f4;font-size:46px}input,button{box-sizing:border-box;width:100%;padding:15px;margin:12px 0;border-radius:12px;border:1px solid #3775ff;background:#10203c;color:white;font:inherit}button{cursor:pointer;background:#264da9}p{line-height:1.5;color:#adc0d8}#status{min-height:50px}</style></head><body><main><h1>Aether AI</h1><p>Casa simulada compartilhada. As ações e o histórico ficam visíveis para os participantes deste teste.</p><form><label for="password">Senha da equipe</label><input id="password" type="password" required autocomplete="current-password"><button>Entrar</button></form><p id="status" role="status"></p></main><script>
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('input').value})});const d=await r.json();if(!r.ok)throw Error(d.detail);location.replace('/painel');}catch(e){document.querySelector('#status').textContent=e.message;}finally{button.disabled=false;}};
</script></body></html>

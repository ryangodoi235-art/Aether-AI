services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    env_file:
      - .env.backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - aether-data:/var/lib/aether
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
volumes:
  aether-data:
